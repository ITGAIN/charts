apiVersion: v1
kind: ConfigMap
metadata:
  name: s4dbs-nginx-conf
data:
  nginx.conf: |
    worker_processes  5;  ## Default: 1

    pid        /tmp/nginx.pid;
     
    events {
      worker_connections   1000;
    }
     
    http {

      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp_path;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;  
      
      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }
     
      upstream grafana {
        server s4dbs-grafana-service:{{ .Values.s4dbsGrafanaDeployment.port }};
      }
     
      upstream service {
        server s4dbs-service-service:{{ .Values.s4dbsServiceDeployment.port }};
      }

      upstream mcp {
        server s4dbs-mcp-service:{{ .Values.s4dbsMcpDeployment.port }};
      }
       
      server {
      {{- if eq .Values.s4dbsReverseDeployment.protocol "HTTP" }}
        listen {{ .Values.s4dbsReverseDeployment.port }};
        #SSL / HTTPS deactivated 
      {{- end }}
        root /usr/share/nginx/www;
        index index.html index.htm;

    {{ if eq .Values.s4dbsReverseDeployment.protocol "HTTPS" }}
    #SSL / HTTPS Config
        listen {{ .Values.s4dbsReverseDeployment.port }} ssl;
        listen [::]:{{ .Values.s4dbsReverseDeployment.port }} ssl;
        ssl_certificate_key /etc/ssl/ssl_cert.key;
        ssl_certificate     /etc/ssl/ssl_cert.crt;
    {{ end }}
     
    # service
        location /Speedgain_for_Databases_Service/ {
          proxy_set_header Host $http_host;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_pass http://service;
        }

    # frontend
        location / {
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Server $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Host $http_host;
          proxy_pass http://s4dbs-frontend-service:{{ .Values.s4dbsFrontendDeployment.port }}/s4dbs-ui/;
        }
        location /s4dbs-ui/ {
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Server $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Host $http_host;
          proxy_pass http://s4dbs-frontend-service:{{ .Values.s4dbsFrontendDeployment.port }}/s4dbs-ui/;
        }
     
    # grafana
        location /grafana/ {
          proxy_set_header Host $http_host;
          proxy_pass http://grafana;
          proxy_read_timeout 300;
          proxy_connect_timeout 300;
          proxy_send_timeout 300; 
        }
     
        location /grafana/api/live/ {
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host $http_host;
          proxy_pass http://grafana;
          proxy_read_timeout 300;
          proxy_connect_timeout 300;
          proxy_send_timeout 300; 
        }

    # mcp
        location ^~ /Speedgain_for_Databases_Mcp/ {
          proxy_pass http://mcp/mcp;

          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_buffering off;
          proxy_cache     off;
          proxy_set_header Accept-Encoding    "";
          proxy_set_header Host               $host;
          proxy_set_header X-Real-IP          $remote_addr;
          proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto  $scheme;
          proxy_read_timeout    3600s;
          proxy_send_timeout    3600s;
          proxy_connect_timeout   15s;
          proxy_pass_header Mcp-Session-Id;

          add_header Access-Control-Allow-Origin   "*" always;
          add_header Access-Control-Allow-Headers  "Content-Type, Mcp-Session-Id, Authorization" always;
          add_header Access-Control-Expose-Headers "Mcp-Session-Id" always;

          if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS";
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Headers "Content-Type, Mcp-Session-Id, Authorization";
            return 204;
          }
        }
      }
    } 